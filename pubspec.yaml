name: flutter_push_plus
description: "Unified remote push (APNs/FCM), local notifications and tap routing for Flutter."
version: 0.5.0
homepage: https://github.com/20156284/flutter_push_plus
repository: https://github.com/20156284/flutter_push_plus

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.will.flutter_push_plus
        pluginClass: FlutterPushPlusPlugin
      ios:
        pluginClass: FlutterPushPlusPlugin
